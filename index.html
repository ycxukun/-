<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好生涯升学认知知识库</title>
  <style>
    :root{--green:#0a7c42;--green2:#0f9a55;--bg:#f7faf8;--card:#fff;--text:#102017;--muted:#657469;--line:#dce7df;--warn:#b45309;--red:#b91c1c;--blue:#1d4ed8;--shadow:0 12px 32px rgba(7,54,32,.10);}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f2faf5 0,#fff 330px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);line-height:1.75} a{color:var(--green);text-decoration:none} a:hover{text-decoration:underline}
    .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);position:sticky;top:0;height:100vh;overflow:auto;padding:24px 18px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--green),#89d7a6);box-shadow:var(--shadow)}.brand h1{font-size:18px;line-height:1.25;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;outline:none;margin:8px 0 18px}.search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(10,124,66,.12)}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;color:#203328;cursor:pointer;font-size:14px;margin:2px 0}.nav button:hover,.nav button.active{background:#eaf6ee;color:var(--green);font-weight:700}.side-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.main{padding:34px 44px;max-width:1180px}.hero{border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.86);padding:34px;box-shadow:var(--shadow);margin-bottom:24px}.eyebrow{font-weight:800;color:var(--green);letter-spacing:.08em;font-size:13px}.hero h2{font-size:34px;line-height:1.22;margin:10px 0}.hero p{color:var(--muted);font-size:16px;max-width:820px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 22px rgba(17,64,35,.06);cursor:pointer;transition:.16s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#b6d8c2}.card h3{margin:0 0 8px;font-size:18px}.card p{margin:0 0 12px;color:var(--muted);font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;border:1px solid #d9eadf;background:#f5fbf7;color:#335b43;border-radius:999px;padding:3px 8px}.tag.warn{border-color:#f4d7a1;background:#fff8ec;color:#8a5200}.tag.red{border-color:#f3b4b4;background:#fff4f4;color:#991b1b}.content{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 8px 22px rgba(17,64,35,.05)}.content h1{font-size:30px;line-height:1.25;margin:0 0 14px}.content h2{font-size:22px;margin:30px 0 12px;padding-top:8px;border-top:1px solid #edf3ef}.content h3{font-size:18px;margin:24px 0 10px}.content p{margin:10px 0}.content blockquote{margin:16px 0;padding:12px 16px;border-left:4px solid var(--green);background:#f4faf6;color:#254331;border-radius:0 12px 12px 0}.content table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px;overflow:hidden;border-radius:14px}.content th,.content td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}.content th{background:#f3faf6}.content ul,.content ol{padding-left:22px}.empty{padding:32px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:#fff}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer;color:#254331}.back:hover{border-color:var(--green);color:var(--green)}.footer{margin:30px 0;color:var(--muted);font-size:12px}.watermark{position:fixed;right:22px;bottom:18px;color:rgba(10,124,66,.32);font-weight:800;font-size:13px;pointer-events:none}
    @media(max-width:860px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.main{padding:22px 16px}.hero h2{font-size:26px}.content{padding:20px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"></div><div><h1>好生涯升学认知知识库</h1><p>无文件夹上传版</p></div></div>
    <input class="search" id="search" placeholder="搜索：专业、院校、误区、专业组..." />
    <nav class="nav" id="nav"></nav>
    <div class="side-note">维护方式：只需上传 <b>index.html</b> 和 <b>content.js</b>。后续主要修改 <b>content.js</b> 中的内容块。</div>
  </aside>
  <main class="main"><div id="view"></div><div class="footer">资料状态说明：凡涉及具体招生计划、专业组代码、转专业政策、学费、校区、体检限制等，均应以当年官方来源为准。</div></main>
</div>
<div class="watermark">好生涯早规划</div>
<script src="content.js"></script>
<script>
const KB = window.HSY_KB;
const state = { section:'home', item:null, query:'' };
const sections = [
  ['home','首页'], ['admission','志愿填报认知'], ['majors','专业认知卡片库'], ['schools','院校认知卡片库'], ['tools','工具与测试'], ['maintenance','维护说明']
];
function escapeHtml(s){return String(s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function inline(s){return escapeHtml(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function mdTable(lines,i){let rows=[];while(i<lines.length && /^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}if(rows.length<2) return [null,i];let html='<table>';rows.forEach((r,idx)=>{if(idx===1 && /^\s*\|?\s*:?-{3,}/.test(r)) return;let cells=r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>inline(c.trim()));html += '<tr>'+cells.map(c=>idx===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')+'</tr>';});html+='</table>';return [html,i];}
function renderMarkdown(md){let lines=String(md||'').split(/\r?\n/);let html=[], list=null;function closeList(){if(list){html.push(`</${list}>`);list=null;}}for(let i=0;i<lines.length;i++){let line=lines[i]; if(!line.trim()){closeList();continue;} if(/^\s*\|/.test(line)){closeList();let [t,ni]=mdTable(lines,i); if(t){html.push(t); i=ni-1; continue;}} let m;if(m=line.match(/^###\s+(.+)/)){closeList();html.push('<h3>'+inline(m[1])+'</h3>');continue;} if(m=line.match(/^##\s+(.+)/)){closeList();html.push('<h2>'+inline(m[1])+'</h2>');continue;} if(m=line.match(/^#\s+(.+)/)){closeList();html.push('<h1>'+inline(m[1])+'</h1>');continue;} if(m=line.match(/^>\s?(.+)/)){closeList();html.push('<blockquote>'+inline(m[1])+'</blockquote>');continue;} if(m=line.match(/^[-*]\s+(.+)/)){if(list!=='ul'){closeList();html.push('<ul>');list='ul';}html.push('<li>'+inline(m[1])+'</li>');continue;} if(m=line.match(/^\d+\.\s+(.+)/)){if(list!=='ol'){closeList();html.push('<ol>');list='ol';}html.push('<li>'+inline(m[1])+'</li>');continue;} closeList();html.push('<p>'+inline(line)+'</p>');}closeList();return html.join('\n');}
function allItems(section){ if(section==='admission') return KB.admission; if(section==='majors') return KB.majors; if(section==='schools') return KB.schools; if(section==='tools') return KB.tools; return []; }
function itemText(x){return [x.title,x.category,x.summary,(x.tags||[]).join(' '),x.risk_level,x.recommend_level,x.body,x.city,x.level,x.type].join(' ').toLowerCase();}
function nav(){document.getElementById('nav').innerHTML = sections.map(([id,name])=>`<button class="${state.section===id?'active':''}" onclick="go('${id}')">${name}</button>`).join('');}
function go(section){state.section=section;state.item=null;state.query='';document.getElementById('search').value='';render();}
function openItem(section,id){state.section=section;state.item=id;render();window.scrollTo({top:0,behavior:'smooth'});}
function card(x,section){let tags=(x.tags||[]).slice(0,4).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');let meta=[x.status&&`<span class="tag warn">${escapeHtml(x.status)}</span>`,x.updated_at&&`<span class="tag">${escapeHtml(x.updated_at)}</span>`].filter(Boolean).join('');return `<article class="card" onclick="openItem('${section}','${x.id}')"><h3>${escapeHtml(x.title)}</h3><p>${escapeHtml(x.summary||x.risk_level||'点击查看详细内容。')}</p><div class="meta">${tags}${meta}</div></article>`;}
function listView(section,title,desc){let q=state.query.trim().toLowerCase();let items=allItems(section).filter(x=>!q || itemText(x).includes(q));return `<div class="hero"><div class="eyebrow">${escapeHtml(title)}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(desc)}</p><div class="toolbar"><span class="pill">共 ${items.length} 条</span><span class="pill">支持本页搜索</span><span class="pill">内容来自 content.js</span></div></div>`+(items.length?`<div class="grid">${items.map(x=>card(x,section)).join('')}</div>`:`<div class="empty">没有找到匹配内容。</div>`);}
function detailView(section,id){let x=allItems(section).find(a=>a.id===id);if(!x)return '<div class="empty">内容不存在。</div>';return `<div class="topline"><button class="back" onclick="state.item=null;render()">← 返回列表</button><div class="meta"><span class="tag warn">${escapeHtml(x.status||'待核对')}</span>${x.updated_at?`<span class="tag">${escapeHtml(x.updated_at)}</span>`:''}</div></div><article class="content"><h1>${escapeHtml(x.title)}</h1><p style="color:var(--muted)">${escapeHtml(x.summary||'')}</p>${renderMarkdown(x.body)}</article>`;}
function home(){return `<section class="hero"><div class="eyebrow">${escapeHtml(KB.site.version)} · ${escapeHtml(KB.site.updated_at)}</div><h2>${escapeHtml(KB.site.title)}</h2><p>${escapeHtml(KB.site.subtitle)}</p><div class="toolbar"><span class="pill">志愿填报认知</span><span class="pill">专业认知</span><span class="pill">院校认知</span><span class="pill">可维护静态网页</span></div></section><article class="content">${renderMarkdown(KB.home.body)}</article>`}
function maintenance(){return `<section class="hero"><div class="eyebrow">维护说明</div><h2>${escapeHtml(KB.maintenance.title)}</h2><p>${escapeHtml(KB.maintenance.summary||'说明如何修改、备份和扩展这个无文件夹版本。')}</p></section><article class="content">${renderMarkdown(KB.maintenance.body)}</article>`}
function render(){nav();let v='';if(state.item){v=detailView(state.section,state.item)}else if(state.section==='home'){v=home()}else if(state.section==='admission'){v=listView('admission','志愿填报认知','解释志愿填报的基本规则、专业组逻辑、冲稳保与调剂风险。')}else if(state.section==='majors'){v=listView('majors','专业认知卡片库','以报考决策为导向理解专业，而不是做百科式介绍。')}else if(state.section==='schools'){v=listView('schools','院校认知卡片库','强调同一院校不同专业组的价值差异，避免简单学校崇拜。')}else if(state.section==='tools'){v=listView('tools','工具与测试','用于家长认知校准、沟通和内部培训的轻量工具。')}else if(state.section==='maintenance'){v=maintenance()}document.getElementById('view').innerHTML=v;}
document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value; state.item=null; if(state.section==='home'||state.section==='maintenance') state.section='admission'; render();});render();
</script>
</body>
</html>
