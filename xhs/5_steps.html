<h2>选校前先做这5步</h2><div class=sub>江苏考生尤其要看第5步</div>
<div class=box><b>1 看平台</b>　经费、科研体系、整体升学</div>
<div class=box><b>2 看学科</b>　优势学科对应本科专业</div>
<div class=box><b>3 看培养</b>　普通专业、拔尖班、二次选拔</div>
<div class=box><b>4 看出口</b>　分专业保研率、就业去向</div>
<div class=box><b>5 看录取</b>　专业组代码、选科、近三年位次、调剂风险</div>
